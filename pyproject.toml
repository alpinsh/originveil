# No [build-system] table on purpose: with no dependencies and no build system,
# Hermes treats this file as "declares nothing" and skips re-preparing its
# shared Python environment on install. pip falls back to setuptools.
[project]
name = "originveil"
version = "0.1.2"
description = "Inside-out audit of an origin server behind Cloudflare: DNS leaks, direct reachability, AOP, firewall."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
keywords = ["cloudflare", "origin", "waf-bypass", "security", "audit", "blue-team"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
originveil = "originveil.cli:main"

[project.urls]
Homepage = "https://github.com/alpinsh/originveil"

[tool.setuptools]
packages = ["originveil", "originveil.checks"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "tests"]
